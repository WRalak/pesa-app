name: Mobile release

# Tag vX.Y.Z to produce a signed, obfuscated Android App Bundle and an iOS
# archive-ready build. Signing material and Firebase configs come from
# GitHub Environment secrets and are never committed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    environment: prod
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.1, cache: true }
      - name: Signing key and Firebase config (from secrets)
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > android/app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - run: flutter pub get && dart run build_runner build -d && flutter gen-l10n
      - run: flutter test
      - name: Build signed App Bundle
        run: |
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols \
            --build-name=${GITHUB_REF_NAME#v} --build-number=${{ github.run_number }} \
            --dart-define=ENV=prod --dart-define=API_BASE_URL=${{ vars.PROD_API_BASE_URL }} --dart-define=APP_VERSION=${GITHUB_REF_NAME#v}
      - uses: actions/upload-artifact@v4
        with: { name: android-release, path: "mobile/build/app/outputs/bundle/release/app-release.aab" }
      - uses: actions/upload-artifact@v4
        with: { name: android-symbols, path: mobile/build/symbols }
      - if: always()
        run: rm -f android/app/upload.jks android/key.properties android/app/google-services.json

  ios:
    runs-on: macos-15
    environment: prod
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.1, cache: true }
      - env: { PLIST: "${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}" }
        run: printf '%s' "$PLIST" > ios/Runner/GoogleService-Info.plist
      - run: flutter pub get && dart run build_runner build -d && flutter gen-l10n
      - name: Build (unsigned; signing/upload via Xcode Cloud or fastlane match)
        run: |
          flutter build ipa --release --no-codesign --obfuscate --split-debug-info=build/symbols \
            --build-name=${GITHUB_REF_NAME#v} --build-number=${{ github.run_number }} \
            --dart-define=ENV=prod --dart-define=API_BASE_URL=${{ vars.PROD_API_BASE_URL }} --dart-define=APP_VERSION=${GITHUB_REF_NAME#v}
