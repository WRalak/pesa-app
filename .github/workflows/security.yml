name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: cd backend && npm ci && npm audit --omit=dev --audit-level=high
      - run: cd admin && npm ci && npm audit --omit=dev --audit-level=high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with: { fail-on-severity: high, deny-licenses: "AGPL-3.0, GPL-3.0" }

  codeql:
    name: Static analysis (CodeQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@v3

  containers:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pesa-api:scan backend && docker build -t pesa-admin:scan admin
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "pesa-api:scan", severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1", format: sarif, output: trivy-api.sarif }
      - uses: aquasecurity/trivy-action@0.28.0
        if: always()
        with: { image-ref: "pesa-admin:scan", severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1", format: sarif, output: trivy-admin.sarif }
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy-api.sarif, category: trivy-api }

  iac:
    name: IaC scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with: { directory: infrastructure/terraform, framework: terraform, soft_fail: false, skip_check: CKV_AWS_337 }
