name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - name: Native import check + unit, integration, payment, security tests
        run: npm test -- --coverage
      - name: OpenAPI spec is current
        run: npm run openapi && git diff --exit-code ../docs/api/openapi.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-coverage, path: backend/coverage/lcov.info }

  admin:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: admin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: admin/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.50.1, cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test || echo "::warning::formatting differs"
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build Android (staging config, unsigned)
        run: flutter build apk --release --dart-define=ENV=staging --dart-define=API_BASE_URL=https://api.staging.pesa.africa

  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infrastructure/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  docker:
    runs-on: ubuntu-latest
    needs: [backend, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t pesa-api:ci backend
      - run: docker build -t pesa-admin:ci admin
      - name: Smoke-test the API image (non-root, read-only)
        run: |
          docker network create t
          docker run -d --network t --name mongo mongo:7.0 --replSet rs0
          docker run -d --network t --name redis redis:7.4-alpine
          sleep 8
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]})"
          sleep 5
          docker run -d --network t --name api -p 4000:4000 --read-only --tmpfs /tmp --cap-drop ALL \
            -e NODE_ENV=development -e MONGODB_URI='mongodb://mongo:27017/pesa?replicaSet=rs0' -e REDIS_URL=redis://redis:6379 pesa-api:ci
          for i in $(seq 1 30); do curl -sf localhost:4000/health/ready && exit 0; sleep 2; done
          docker logs api; exit 1
