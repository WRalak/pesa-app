# Admin console: static SPA with strict security headers. Deploy behind the
# internal ALB / VPN only (see docs/DEPLOYMENT.md) — never on the public edge.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  location = /healthz { access_log off; return 200 "ok"; }

  # Same-origin API proxy for local/compose use (production uses the API domain).
  location /admin/v1/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-store"; try_files $uri /index.html; }
}
